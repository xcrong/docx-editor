name: Perf Baseline Refresh

# Re-capture the large-document perf baseline on the CI runner and commit it to
# main, so the committed numbers stay current and machine-matched with what the
# `perf-check` label run measures.
#
# workflow_dispatch only: it runs trusted code from `main` and pushes the
# refreshed baseline back to main via the workflow's GITHUB_TOKEN.

on:
  workflow_dispatch:

concurrency:
  group: perf-baseline-refresh
  cancel-in-progress: false

permissions:
  contents: write

env:
  PERF_SPEC: e2e/tests/performance-large-docs-comments-suggestions.spec.ts
  PERF_BASELINE: e2e/perf-baselines/large-docs-comments-suggestions.json

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main
        uses: actions/checkout@v6.0.3
        with:
          ref: main

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright (chromium)
        run: npx playwright install --with-deps chromium

      - name: Capture baseline
        env:
          PERF_EMIT_JSON: '1'
          PERF_REACT_ONLY: '1'
          PERF_OUT_DIR: e2e/perf-baselines
        run: |
          npx playwright test "$PERF_SPEC" \
            --project=chromium --workers=1 --retries=0 --timeout=120000

      - name: Commit refreshed baseline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- "$PERF_BASELINE"; then
            echo "Baseline unchanged — nothing to commit."
            exit 0
          fi
          git add "$PERF_BASELINE"
          git commit -m "chore: refresh large-doc perf baseline"
          git push origin main
