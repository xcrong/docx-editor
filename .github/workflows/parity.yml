name: Parity gates

# Dual-adapter Playwright architecture + snapshot/bundle gates (T28-01 §7,
# issue #84; tracks #71). `parity-e2e` runs the full cross-adapter suite on
# every PR; `react-e2e` runs a FAST smoke subset of the React-only suite and
# `vue-e2e` the single-adapter Vue suite, but only when the PR touches that
# adapter's surface (§7.6). The FULL React-only suite (1016 tests, ~30min per
# 1-worker CI shard) cannot fit a PR gate — it runs nightly via
# `react-e2e-nightly.yml` (see #107 for the suite-rot tracking). Static gates
# (snapshot digest, bundle size, matrix freshness) live in ci.yml next to the
# build they depend on; this workflow owns the browser.
#
# Dependabot PRs are handled by dependabot-lockfile.yml, so we skip them
# here like ci.yml does.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    outputs:
      react: ${{ steps.filter.outputs.react }}
      vue: ${{ steps.filter.outputs.vue }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Detect touched adapter surface
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            react:
              - 'packages/react/**'
              - 'packages/agents/src/react/**'
              - 'packages/core/**'
            vue:
              - 'packages/vue/**'
              - 'packages/agents/src/vue/**'
              - 'packages/core/**'

  parity-e2e:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright (chromium)
        run: npx playwright install --with-deps chromium

      - name: Install metric-compatible fonts (Calibri/Cambria)
        run: sudo apt-get update && sudo apt-get install -y fonts-crosextra-carlito fonts-crosextra-caladea

      - name: Cross-adapter parity suite
        run: NO_NUXT=1 npx playwright test --project=parity --timeout=30000

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: parity-failure-screenshots
          path: screenshots/test-results/
          retention-days: 7

  react-e2e:
    needs: changes
    if: needs.changes.outputs.react == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # FAST smoke gate, not the full suite: 68 stable specs covering
    # mount/type/format/save/parity-adjacent areas (editor mount,
    # text-editing type, formatting format, image-roundtrip +
    # track-changes-comments-roundtrip save & revision-area), 2 shards,
    # 1 worker each (~34 tests ≈ 3-4min per shard + startup). The FULL
    # 1016-test suite cannot fit a PR gate (each 1-worker CI shard needed
    # ~30min and timed out) — it runs nightly via `react-e2e-nightly.yml`.
    #
    # Smoke files are green across every CI retry of run 42789584888 AND the
    # local full + isolation runs; quarantined specs (test.fixme → #107) are
    # excluded by selection. Keep this list in sync with green-everywhere files.
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/2', '2/2']
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright (chromium)
        run: npx playwright install --with-deps chromium

      - name: Install metric-compatible fonts (Calibri/Cambria)
        run: sudo apt-get update && sudo apt-get install -y fonts-crosextra-carlito fonts-crosextra-caladea

      - name: React smoke suite (shard ${{ matrix.shard }})
        run: NO_NUXT=1 npx playwright test --project=chromium --timeout=30000 --shard=${{ matrix.shard }} e2e/editor.spec.ts e2e/tests/text-editing.spec.ts e2e/tests/formatting.spec.ts e2e/tests/image-roundtrip.spec.ts e2e/tests/track-changes-comments-roundtrip.spec.ts

      - name: Upload failure screenshots (shard ${{ matrix.shard }})
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: react-smoke-failure-screenshots-${{ matrix.shard }}
          path: screenshots/test-results/
          retention-days: 7

  vue-e2e:
    needs: changes
    if: needs.changes.outputs.vue == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright (chromium)
        run: npx playwright install --with-deps chromium

      - name: Install metric-compatible fonts (Calibri/Cambria)
        run: sudo apt-get update && sudo apt-get install -y fonts-crosextra-carlito fonts-crosextra-caladea

      - name: Vue-only suite
        run: NO_NUXT=1 npx playwright test --project=vue --timeout=30000

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vue-failure-screenshots
          path: screenshots/test-results/
          retention-days: 7
