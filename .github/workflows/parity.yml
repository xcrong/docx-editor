name: Parity gates

# Dual-adapter Playwright architecture + snapshot/bundle gates (T28-01 §7,
# issue #84; tracks #71). `parity-e2e` runs the full cross-adapter suite on
# every PR; `react-e2e` / `vue-e2e` run the single-adapter suites only when
# the PR touches that adapter's surface (§7.6). Static gates (snapshot
# digest, bundle size, matrix freshness) live in ci.yml next to the build
# they depend on; this workflow owns the browser.
#
# Dependabot PRs are handled by dependabot-lockfile.yml, so we skip them
# here like ci.yml does.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    outputs:
      react: ${{ steps.filter.outputs.react }}
      vue: ${{ steps.filter.outputs.vue }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Detect touched adapter surface
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            react:
              - 'packages/react/**'
              - 'packages/agent-use/src/react/**'
            vue:
              - 'packages/vue/**'
              - 'packages/agent-use/src/vue/**'

  parity-e2e:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright (chromium)
        run: npx playwright install --with-deps chromium

      - name: Cross-adapter parity suite
        run: NO_NUXT=1 npx playwright test --project=parity --timeout=30000

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: parity-failure-screenshots
          path: screenshots/test-results/
          retention-days: 7

  react-e2e:
    needs: changes
    if: needs.changes.outputs.react == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright (chromium)
        run: npx playwright install --with-deps chromium

      - name: React-only suite
        run: NO_NUXT=1 npx playwright test --project=chromium --timeout=30000

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: react-failure-screenshots
          path: screenshots/test-results/
          retention-days: 7

  vue-e2e:
    needs: changes
    if: needs.changes.outputs.vue == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright (chromium)
        run: npx playwright install --with-deps chromium

      - name: Vue-only suite
        run: NO_NUXT=1 npx playwright test --project=vue --timeout=30000

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vue-failure-screenshots
          path: screenshots/test-results/
          retention-days: 7
