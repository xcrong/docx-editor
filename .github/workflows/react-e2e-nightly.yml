name: React e2e (nightly full suite)

# The FULL 1016-test React-only suite. Too big for a per-PR gate (each
# 1-worker CI shard needs ~30min), so the merge gate runs a fast smoke subset
# in `parity.yml` (`react-e2e`) while this workflow runs the FULL suite nightly
# on main and leaves failures visible here (logs + screenshots as artifacts).
# Triage is owned by the suite-rot tracking issue (#107); quarantined specs
# (`test.fixme` with the issue link) are skipped here too.

on:
  schedule:
    # 03:00 UTC daily — off-hours for both US and Asia devs.
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  react-e2e-full:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # Same sharded shape the per-PR gate used to use: ~250 tests per shard,
    # 1 worker per shard for stability.
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/4', '2/4', '3/4', '4/4']
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright (chromium)
        run: npx playwright install --with-deps chromium

      - name: Install metric-compatible fonts (Calibri/Cambria)
        run: sudo apt-get update && sudo apt-get install -y fonts-crosextra-carlito fonts-crosextra-caladea

      - name: React-only full suite (shard ${{ matrix.shard }})
        id: suite
        run: |
          set +e
          NO_NUXT=1 npx playwright test --project=chromium --timeout=30000 --shard=${{ matrix.shard }} > full-suite-${{ matrix.shard }}.log 2>&1
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          tail -30 full-suite-${{ matrix.shard }}.log
          exit 0

      - name: Upload failure screenshots (shard ${{ matrix.shard }})
        if: failure() || steps.suite.outputs.exit_code != '0'
        uses: actions/upload-artifact@v4
        with:
          name: react-nightly-failure-screenshots-${{ matrix.shard }}
          path: screenshots/test-results/
          retention-days: 14

      - name: Upload shard log (shard ${{ matrix.shard }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: react-nightly-log-${{ matrix.shard }}
          path: full-suite-${{ matrix.shard }}.log
          retention-days: 14
